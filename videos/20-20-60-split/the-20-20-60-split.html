  return [r.head[0] - Math.sin(L) * hd * fac, r.head[1] + Math.cos(L) * hd]; }
/** SALES: ink figure with a red tie (knot + blade follow the torso). */
function salesman(g, F) {
  const r = person(g, Object.assign({ color: PAL.ink }, F)); if ((F.draw ?? 1) < .6) return r;
  const s = F.s || 1, n = neckOf(F, r), h = r.hip, L = Math.hypot(h[0] - n[0], h[1] - n[1]) || 1, ux = (h[0] - n[0]) / L, uy = (h[1] - n[1]) / L, px = -uy, py = ux;
  const P = (a, b) => [n[0] + ux * a * s + px * b * s, n[1] + uy * a * s + py * b * s];
  g.save(); g.globalAlpha *= F.alpha ?? 1;
  fillPoly(g, [P(8, -8), P(8, 8), P(20, 7), P(20, -7)], PAL.red);
  fillPoly(g, [P(20, -6), P(20, 6), P(64, 12), P(80, 0), P(64, -12)], PAL.red);
  g.restore(); return r;
}
/** NEVER BUY: pockets turned inside out ("can't pay"), popping in with pk 0..1. */
function neverBuyer(g, F, pk = 1) {
  const r = person(g, F); if (pk <= 0) return r;
  const s = (F.s || 1) * 1.35, q = E.back(clamp(pk));
  [-1, 1].forEach((d, i) => {
    const x = r.hip[0] + d * 22 * s, y = r.hip[1] + 6 * s, sw = Math.sin((F.t || 0) * 3 + i) * .12;
    g.save(); g.translate(x, y); g.rotate(sw + d * .15); g.scale(q, q);
    fillPoly(g, rrectPoly(-12 * s, 0, 24 * s, 30 * s, 9 * s), PAL.cream);
    tracePoly(g, rrectPoly(-12 * s, 0, 24 * s, 30 * s, 9 * s)); g.lineWidth = 4 * s; g.strokeStyle = PAL.ink; g.stroke();
    g.restore();
  });
  return r;
}
/** DEFINITELY BUY: phone in hand with a ticked screen (already researched, already decided). */
function sureBuyer(g, F, ph = 1) {
  const r = person(g, F); if (ph <= 0) return r;
  const s = F.s || 1, q = E.back(clamp(ph)), [hx, hy] = r.handF;
  popAt(g, hx, hy - 18 * s, q, () => {
    fillPoly(g, rrectPoly(hx - 17 * s, hy - 48 * s, 34 * s, 58 * s, 8 * s), PAL.ink);
    fillPoly(g, rrectPoly(hx - 12 * s, hy - 42 * s, 24 * s, 42 * s, 4 * s), PAL.cream);
    strokeOn(g, [[hx - 7 * s, hy - 22 * s], [hx - 2 * s, hy - 16 * s], [hx + 7 * s, hy - 29 * s]], prog(ph, .4, 1), PAL.red, 4 * s);
  });
  return r;
}
/** CONFUSED: pacing on the spot, turning left/right, alternating head-scratch and shrug. Returns {x, facing, pose}. */
function pacing(x0, t, i, on = 1) {
  const ph = t * 1.4 + i * 1.7, x = x0 + Math.sin(ph) * 18 * on, facing = Math.cos(ph) >= 0 ? 1 : -1;
  const alt = .5 + .5 * Math.sin(t * 1.1 + i * 2.3);
  return { x, facing, pose: poseMix(POSES.stand, poseMix(POSES.shrug, POSES.think, alt), on) };
}
/** A pitch: a speech bubble carrying a product (box with a red band). */
function pitchBubble(g, x, y, s, col, a = 1) {
  if (a <= 0) return;
  fadeAlpha(g, a, () => {
    g.beginPath(); g.arc(x, y, 38 * s, 0, 7); g.fillStyle = PAL.cream; g.fill(); g.lineWidth = 5; g.strokeStyle = col; g.stroke();
    fillPoly(g, rrectPoly(x - 17 * s, y - 14 * s, 34 * s, 28 * s, 5 * s), col === PAL.gray ? PAL.gray : PAL.ink);
    fillPoly(g, rrectPoly(x - 4 * s, y - 14 * s, 8 * s, 28 * s, 2), col === PAL.gray ? rgba(PAL.cream, .7) : PAL.red);
  });
}
function linePts2(x0, y0, x1, y1) { const o = []; for (let i = 0; i < KN; i++) o.push([lerp(x0, x1, i / (KN - 1)), lerp(y0, y1, i / (KN - 1))]); return o; }

/** Deterministic tangle (a knot of confusion) with N points; untangles into a straight arrow shaft. */
const KN = 240;
function knotPts(cx, cy, r) {
  const o = [];
  for (let i = 0; i < KN; i++) { const a = i / (KN - 1) * Math.PI * 10, rr = r * (0.55 + 0.45 * Math.sin(a * 1.37 + 0.8));
    o.push([cx + Math.cos(a) * rr * 1.25, cy + Math.sin(a * 1.13) * rr * 0.8]); }
  return o;
}
function linePts(x0, x1, y) { const o = []; for (let i = 0; i < KN; i++) o.push([lerp(x0, x1, i / (KN - 1)), y]); return o; }

function buildScenes() {
  const W = CONFIG.width, H = CONFIG.height;
  const KNOT = knotPts(960, 430, 120), LINE = linePts(700, 1160, 430);

  SCENES = [
    /* 1. THE 20-20-60 SPLIT  (cues 1-3)  ten buyers -> the bar splits 20 | 20 | 60 -> first 20% = NEVER BUY */

        fadeAlpha(g, 1 - prog(t, cue(3), cue(3) + .4), () => headline(g, 'THE 20-20-60 SPLIT', 960, 220, prog(t, cue(2), cue(2) + 1.1), { align: 'center', size: 96, red: [1] }));
        headline(g, '20% NEVER BUY', 140, 220, prog(t, cue(3) + .3, cue(3) + 1.3), { size: 92, red: [1, 2] });
      } },

    /* 2. NEVER BUY  (cues 4-7)  nobody knows why they're here; no need, can't pay; won't buy; sales not needed */

        [cue(6) + 2.6, { x: -60, y: 70, z: 1.12 }], [cue(7) + .2, { x: -60, y: 70, z: 1.12 }], [cue(7) + 1.4, { x: 0, y: 0, z: 1 }]], a); },
      draw(g, t0, T, c) {
        const t = t0 + cue(4) - TR; dotGrid(g, c);
        const hx = 620, usKf = [[cue(6), 1420], [cue(6) + 1.4, 1060, E.out]];
        world(g, c, () => {
          groundLine(g, GY, 1);
          // hero: a Never Buy buyer (red)

          hp = poseMix(hp, POSES.shrug, E.inOut(prog(t, cue(4) + .1, cue(4) + .6)));
          hp = poseMix(hp, POSES.stop, E.inOut(prog(t, cue(5), cue(5) + .5)));            // "no need"

          tag(g, 'NEVER BUY', hx, GY + 70, prog(t, cue(4) + .2, cue(4) + .6), { size: 30, bg: PAL.red });
          // cue 4: "?" for both of them
          const qOut = 1 - prog(t, cue(5) - .3, cue(5));
          [[hr, 1, cue(4) + .2], [ur, -1, cue(4) + .9]].forEach(([r, d, a]) => thoughtBubble(g, r.head[0] + 40 * d, r.head[1] - 40, r.head[0] + 150 * d, r.head[1] - 150, 64, prog(t, a, a + 1.0) * qOut, (g2, rr, q) => {

          // cue 6: product pitches fly from the salesman's hand, bounce off the raised palm and drop, going gray

            let x, y, col = PAL.ink;

            else { x = hitX + 90 * fall; y = hitY + (GY - 40 - hitY) * fall * fall - Math.sin(Math.PI * fall) * 60; col = PAL.gray; }
            pitchBubble(g, x, y, 1.4, col, 1 - prog(fall, .75, 1));
          }
          crossMark(g, (hx + 1060) / 2, 590, 90, prog(t, cue(7) + .5, cue(7) + 1.1));
        });
        subline(g, '20% NEVER BUY', 140, 150, 1, 0, { face: 'label', size: 30, color: PAL.gray });
        const hA = (a, b) => 1 - prog(t, a, b);
        fadeAlpha(g, hA(cue(5) - .3, cue(5)), () => {
          headline(g, 'WHY ARE THEY HERE?', 140, 240, prog(t, cue(4) + .1, cue(4) + 1.0), { size: 84, red: [3] });
          subline(g, "They don't know.", 140, 312, prog(t, cue(4) + 1.2, cue(4) + 1.7), 0, { size: 40 });
          subline(g, "We don't know.", 140, 362, prog(t, cue(4) + 1.9, cue(4) + 2.4), 0, { size: 40 });
        });
        fadeAlpha(g, hA(cue(6) - .3, cue(6)), () => headline(g, "NO NEED. CAN'T PAY.", 140, 240, prog(t, cue(5) + .1, cue(5) + 1.0), { size: 84, red: [3] }));
        fadeAlpha(g, hA(cue(7) - .3, cue(7)), () => {
          headline(g, "THEY WON'T BUY", 140, 240, prog(t, cue(6) + .1, cue(6) + 1.0), { size: 84, red: [2] });

    /* 3. DEFINITELY BUY  (cues 8-12)  like an Amazon buyer: decide -> see the product -> search ... features -> purchase */

      } },

          badge(g, hr.head[0] - 110, hr.head[1] - 30, prog(t, cue(16) + 3.0, cue(16) + 3.6), 'tick', PAL.red, PAL.cream, 34);

          subline(g, 'They check everything about us', 140, 312, prog(t, cue(13) + 1.2, cue(13) + 1.7), 0, { size: 40 });
        });

  rec.ondataavailable = e => e.data.size && chunks.push(e.data); const done = new Promise(r => rec.onstop = r);
  renderAt(0, g); rec.start(250); const t0w = performance.now(), t0a = xac ? xac.currentTime + .05 : 0; if (xsrc) xsrc.start(t0a);
  await new Promise(res => { (function f() { const t = xac ? xac.currentTime - t0a : (performance.now() - t0w) / 1000; renderAt(clamp(t, 0, CONFIG.duration), g); status(`Recording MP4 (real time) ${fmt(Math.max(0, t))} / ${fmt(CONFIG.duration)}`); t < CONFIG.duration ? requestAnimationFrame(f) : res(); })(); });
  rec.stop(); await done; if (xac) xac.close();

}
async function exportWebM() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported('video/webm')) return null;
  const c = exportCanvas(), g = c.getContext('2d'), rec = new MediaRecorder(c.captureStream(CONFIG.fps), { mimeType: 'video/webm', videoBitsPerSecond: 12e6 }), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data); const done = new Promise(r => rec.onstop = r);
  rec.start(250); const start = performance.now();
  await new Promise(res => { (function f() { const t = (performance.now() - start) / 1000; renderAt(Math.min(t, CONFIG.duration), g); status(`Recording WebM ${fmt(t)}`); t < CONFIG.duration ? requestAnimationFrame(f) : res(); })(); });

}
async function exportVideo() {
  pause(); $('export').disabled = true; $('dl').hidden = true;
  try {
    const aud = audioOn ? mixBuf : (voiceBuf ? mixBuf : null);
    let blob = await exportWebCodecs(aud) || await exportNative(aud);
    if (blob) { offer(blob, 'mp4'); status(`MP4 ready (${CONFIG.width}×${CONFIG.height}, ${CONFIG.fps} fps, ${aud ? 'with' : 'no'} audio).`); return; }
    status('This environment cannot encode MP4. Open this HTML file in desktop Chrome/Edge to export MP4. Trying a WebM fallback…');
    blob = await exportWebM();
    if (blob) { offer(blob, 'webm'); status('MP4 unavailable here — WebM fallback ready (not an MP4, no audio).'); }
    else status('Video export is blocked in this environment. Open this HTML file in desktop Chrome/Edge.');
  } catch (e) { console.error(e); status('Export failed: ' + e.message); }

}
function srt() {
  const ts = s => { const ms = Math.round(s * 1000), h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, se = Math.floor(ms / 1000) % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(se).padStart(2, '0')},${String(ms % 1000).padStart(3, '0')}`; };
  const txt = CUES.map((c, i) => `${i + 1}\n${ts(c.start)} --> ${ts(c.end)}\n${c.text}\n`).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' })); a.download = `${CONFIG.fileName}.srt`; a.click();
}

/* ================= Boot ================= */
async function rebuildAudio() { if (CONFIG.music || CONFIG.sfx || voiceBuf) { status('Rendering audio…'); mixBuf = await renderMix(); status(''); } }
(async function boot() {
  canvas = $('view'); ctx = canvas.getContext('2d');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  buildScenes();
  $('play').onclick = () => playing ? pause() : play();
  $('restart').onclick = () => { pause(); setTime(0); play(); };
  $('seek').oninput = e => { const was = playing; pause(); setTime(e.target.value / 1000 * CONFIG.duration); if (was) play(); };
  $('export').onclick = exportVideo; $('dl').onclick = saveVideo;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(ns => { dlNS = ns; }).catch(() => {});
  if (CONFIG.music || CONFIG.sfx) { $('audioBtn').hidden = false; $('audioBtn').textContent = `${CONFIG.music ? 'Music' : 'Sound'}: On`; $('audioBtn').onclick = () => { audioOn = !audioOn; $('audioBtn').textContent = `${CONFIG.music ? 'Music' : 'Sound'}: ${audioOn ? 'On' : 'Off'}`; if (playing) { pause(); play(); } }; }
  if (CONFIG.voiceover) { $('voWrap').hidden = false; $('voFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; pause(); const tmp = new AudioContext(); voiceBuf = await tmp.decodeAudioData(await f.arrayBuffer()); tmp.close(); CONFIG.duration = voiceBuf.duration; buildScenes(); await rebuildAudio(); setTime(0); status(`Voiceover loaded: ${voiceBuf.duration.toFixed(2)} s (master clock).`); }; }
  if (CONFIG.subtitles) { $('subBtn').hidden = $('srtBtn').hidden = false; $('subBtn').onclick = () => { showSubs = !showSubs; $('subBtn').textContent = `Subtitles: ${showSubs ? 'On' : 'Off'}`; setTime(tNow); }; $('srtBtn').onclick = srt; }
  addEventListener('resize', sizePreview); sizePreview(); setTime(0);
  if (CONFIG.mode === 'storyboard') { buildStoryboard(); $('export').hidden = true; $('audioBtn').hidden = true; }
  else await rebuildAudio();
  window.renderAt = renderAt; window.CONFIG = CONFIG; window.SCENES = SCENES;
})();
</script>
