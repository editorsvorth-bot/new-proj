<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickman Explainer</title>
<!--
  gen-stickman-v2 — starter engine.
  Copy this file, edit CONFIG, replace the DEMO SCENES block with scenes built from the user's script.
  Keep: rng, easing, rig, morph, text, camera, transitions, renderAt, audio, player, storyboard, export.
  LOCAL ASSET RULE: every visual and sound is generated by this file's code. No image/video/audio
  files, no AI generators, no stock, no icon packs. Only external load: the Mediabunny muxer (technical).
  Demo text below is placeholder — never ship it; every on-screen word must come from the script.

<style>

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141414; --fg:#F4EDE0; --muted:#8C8C8C; } }
  :root[data-theme="dark"] { --bg:#141414; --fg:#F4EDE0; --muted:#8C8C8C; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
  #wrap { max-width:1280px; margin:0 auto; padding:16px; }
  #stage { position:relative; width:100%; background:#F4EDE0; border-radius:6px; overflow:hidden; box-shadow:0 0 0 1px #8C8C8C55; }
  #view { display:block; width:100%; height:auto; }
  #bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  button, .btn { background:#141414; color:#F4EDE0; border:1px solid #8C8C8C; border-radius:4px; padding:6px 12px; cursor:pointer; font:inherit; text-decoration:none; }
  button:hover, .btn:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #seek { flex:1 1 200px; accent-color:#D62828; }
  #time { font-variant-numeric:tabular-nums; min-width:96px; }
  #status { margin-top:8px; color:var(--muted); min-height:1.4em; }
  #dl { color:#D62828; background:none; border:none; padding:0; text-decoration:underline; }
  /* storyboard */
  #sb { display:none; }
  #sb h2 { margin:18px 0 8px; font-size:16px; }
  #sbGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .sbCell { cursor:pointer; border:2px solid transparent; border-radius:6px; overflow:hidden; background:#F4EDE0; }
  .sbCell.sel { border-color:#D62828; }
  .sbCell canvas { display:block; width:100%; height:auto; }
  .sbCell div { padding:6px 8px; font-size:12px; color:#141414; background:#e9e1d2; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="bar">
    <button id="play">Play</button>
    <button id="restart">Restart</button>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span id="time">0:00 / 0:00</span>
    <button id="audioBtn" hidden>Music: On</button>
    <label id="voWrap" hidden class="btn">Load voiceover <input id="voFile" type="file" accept="audio/*" hidden></label>
    <button id="subBtn" hidden>Subtitles: On</button>
    <button id="srtBtn" hidden>Download SRT</button>
    <button id="export">Export Video</button>
    <a id="dl" hidden>Download Video</a>
  </div>
  <div id="status"></div>
  <div id="sb"><h2>Storyboard frames (rendered by the production engine)</h2><div id="sbGrid"></div></div>
</div>
<script>
'use strict';
/* ================= CONFIG (single source of truth — mirror the user's config block) ================= */
const CONFIG = {
  mode: 'player',              // 'storyboard' (Stage 1 contact sheet) | 'player' (Stage 2)
  width: 1920, height: 1080,   // native export resolution
  fps: 30,                     // export frame rate
  duration: 14,                // seconds; voiceover replaces this with the decoded audio length
  seed: 2024,
  music: true,                 // Background music: Enabled/Disabled
  sfx: false,                  // Sound effects: Enabled/Disabled
  voiceover: false,            // Voiceover: Enabled -> file picker + master clock
  subtitles: false,            // Subtitles: Enabled -> CUES drawn in canvas + SRT
  fileName: 'stickman-explainer',
};
/* Palette is locked: black, red, cream, gray. Variation ONLY through opacity of these four. */
const PAL = { ink:'#141414', red:'#D62828', cream:'#F4EDE0', gray:'#8C8C8C' };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const FONT = {
  head: '900 {s}px "Arial Black", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif',
  label: '700 {s}px "Segoe UI", "Helvetica Neue", Arial, sans-serif',
  body: '500 {s}px "Segoe UI", "Helvetica Neue", Arial, sans-serif',
};
const font = (k, s) => FONT[k].replace('{s}', s);

/* ================= Deterministic RNG ================= */
function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }

/* ================= Easing & timing ================= */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const E = {
  lin: t => t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),

/** kf = [[t, value], ...] values: number | {k:number} | [numbers]. Per-segment ease optional as 3rd item. */
function tween(kf, t, ease = E.inOut) {

}
function mix(a, b, p) {

  return p < .5 ? a : b;
}

/* ================= Geometry: polygons, morphing, draw-on ================= */
function polyLen(pts, closed) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); if (closed) L += Math.hypot(pts[0][0] - pts.at(-1)[0], pts[0][1] - pts.at(-1)[1]); return L; }
function resample(pts, N, closed = true) {
  const P = closed ? [...pts, pts[0]] : pts, cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const total = cum.at(-1), out = []; let j = 1;
  for (let i = 0; i < N; i++) {
    const d = total * i / (closed ? N : N - 1);
    while (j < cum.length - 1 && cum[j] < d) j++;
    const f = (d - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1);
    out.push([lerp(P[j - 1][0], P[j][0], f), lerp(P[j - 1][1], P[j][1], f)]);
  }

}
const area = pts => { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
/** Precomputed morph between two closed shapes: same winding, best start-index alignment. Returns t -> pts. */
function makeMorph(a, b, N = 160) {
  const A = resample(a, N); let B = resample(Math.sign(area(a)) === Math.sign(area(b)) ? b : [...b].reverse(), N);
  let best = 0, bestD = Infinity;
  for (let k = 0; k < N; k += 2) { let d = 0; for (let i = 0; i < N; i += 4) { const q = B[(i + k) % N]; d += (A[i][0] - q[0]) ** 2 + (A[i][1] - q[1]) ** 2; } if (d < bestD) { bestD = d; best = k; } }
  B = B.map((_, i) => B[(i + best) % N]);
  return t => A.map((p, i) => [lerp(p[0], B[i][0], t), lerp(p[1], B[i][1], t)]);
}
function circlePoly(cx, cy, r, n = 96) { const o = []; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + i / n * Math.PI * 2; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; }
function rrectPoly(x, y, w, h, r, n = 10) {
  r = Math.min(r, w / 2, h / 2); const o = [];
  const corner = (cx, cy, a0) => { for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  corner(x + w - r, y + r, -Math.PI / 2); corner(x + w - r, y + h - r, 0); corner(x + r, y + h - r, Math.PI / 2); corner(x + r, y + r, Math.PI);
  return o;
}
let _svgPath; // sample any SVG path string (authored by Claude in code) into points
function svgPoly(d, N = 200) {
  if (!_svgPath) { const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.style.cssText = 'position:absolute;width:0;height:0'; document.body.appendChild(svg); _svgPath = document.createElementNS('http://www.w3.org/2000/svg', 'path'); svg.appendChild(_svgPath); }
  _svgPath.setAttribute('d', d); const L = _svgPath.getTotalLength(), o = [];
  for (let i = 0; i < N; i++) { const p = _svgPath.getPointAtLength(L * i / N); o.push([p.x, p.y]); }
  return o;
}
function tracePoly(g, pts, closed = true) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); if (closed) g.closePath(); }
function fillPoly(g, pts, color) { tracePoly(g, pts); g.fillStyle = color; g.fill(); }
/** Draw-on stroke along a polyline (p 0..1). */
function strokeOn(g, pts, p, color = PAL.ink, w = 8, closed = false) {
  if (p <= 0) return; const P = closed ? [...pts, pts[0]] : pts;
  let left = polyLen(P, false) * clamp(p);
  g.save(); g.strokeStyle = color; g.lineWidth = w; g.lineCap = g.lineJoin = 'round'; g.beginPath(); g.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length && left > 0; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]), f = Math.min(1, left / (l || 1)); g.lineTo(lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)); left -= l; }
  g.stroke(); g.restore();
}
function curvePts(x0, y0, x1, y1, bend = .2, n = 28) { const mx = (x0 + x1) / 2 - (y1 - y0) * bend, my = (y0 + y1) / 2 + (x1 - x0) * bend, o = []; for (let i = 0; i <= n; i++) { const t = i / n; o.push([(1 - t) ** 2 * x0 + 2 * (1 - t) * t * mx + t * t * x1, (1 - t) ** 2 * y0 + 2 * (1 - t) * t * my + t * t * y1]); } return o; }
function arrowOn(g, x0, y0, x1, y1, p, color = PAL.red, w = 8, bend = .2) {
  const pts = curvePts(x0, y0, x1, y1, bend); strokeOn(g, pts, prog(p, 0, .8), color, w);
  const hp = E.out(prog(p, .75, 1)); if (hp <= 0) return;
  const a = Math.atan2(y1 - pts.at(-3)[1], x1 - pts.at(-3)[0]), L = 30 * hp;
  strokeOn(g, [[x1 - Math.cos(a - .55) * L, y1 - Math.sin(a - .55) * L], [x1, y1], [x1 - Math.cos(a + .55) * L, y1 - Math.sin(a + .55) * L]], 1, color, w);
}

/* ================= Stickman rig =================
   Angles in degrees, measured from straight DOWN; positive = toward the figure's facing direction.
   Limb = [upper, lower] absolute angles. f = front limb (drawn over torso), b = back limb. */
const RIG = { torso: 112, neck: 12, head: 36, upper: 60, fore: 56, thigh: 70, shin: 68, foot: 16, w: 13 };
const POSES = {
  stand: { lean: 0, head: 0, af: [10, 4], ab: [-10, -4], lf: [6, 2], lb: [-6, -2] },
  point: { lean: -4, head: -4, af: [92, 90], ab: [-12, -6], lf: [8, 2], lb: [-8, -3] },
  shrug: { lean: 0, head: 12, af: [52, 140], ab: [-52, -140], lf: [6, 2], lb: [-6, -2] },
  think: { lean: 3, head: -10, af: [26, 162], ab: [-6, 60], lf: [6, 2], lb: [-6, -2] },
  cheer: { lean: -3, head: -10, af: [158, 172], ab: [-158, -172], lf: [12, 4], lb: [-12, -4] },
  cross: { lean: 2, head: 8, af: [16, -95], ab: [-16, 95], lf: [6, 2], lb: [-6, -2] },
  slump: { lean: 14, head: 28, af: [6, 2], ab: [-2, -2], lf: [4, 0], lb: [-4, 0] },
  reach: { lean: -10, head: -12, af: [120, 125], ab: [-20, -10], lf: [14, 6], lb: [-18, -22] },
  stop:  { lean: -2, head: 0, af: [85, 175], ab: [-10, -4], lf: [8, 2], lb: [-8, -3] }, // palm-up "no"
};
function walkPose(phase, amp = 1) {
  const s = Math.sin(phase), c = Math.cos(phase);
  return { lean: -4 * amp, head: -2, af: [-24 * s * amp, -24 * s * amp + 22], ab: [24 * s * amp, 24 * s * amp + 22],
    lf: [28 * s * amp, 28 * s * amp - 18 * Math.max(0, c) * amp], lb: [-28 * s * amp, -28 * s * amp - 18 * Math.max(0, -c) * amp], bob: Math.abs(c) * 5 * amp };
}
const poseMix = (a, b, t) => mix(a, b, t);
const rad = d => d * Math.PI / 180;
function limbPts(x, y, ang, lens, fac) { const o = [[x, y]]; for (let i = 0; i < ang.length; i++) { x += Math.sin(rad(ang[i])) * lens[i] * fac; y += Math.cos(rad(ang[i])) * lens[i]; o.push([x, y]); } return o; }
/** F = { x, y (ground), s, facing (1|-1), pose, color, expr, draw (0..1 build-on), alpha, faceColor } */
function drawStickman(g, F) {
  const P = F.pose || POSES.stand, fac = F.facing || 1, s = F.s || 1, col = F.color || PAL.ink, d = F.draw ?? 1;
  if (d <= 0) return;
  const legH = a => Math.cos(rad(a[0])) * RIG.thigh + Math.cos(rad(a[1])) * RIG.shin;
  const hipY = -Math.max(legH(P.lf), legH(P.lb)) - (P.bob || 0);
  const L = rad(P.lean || 0), neck = [Math.sin(L) * RIG.torso * fac, hipY - Math.cos(L) * RIG.torso];
  const legF = limbPts(0, hipY, P.lf, [RIG.thigh, RIG.shin], fac), legB = limbPts(0, hipY, P.lb, [RIG.thigh, RIG.shin], fac);
  const armF = limbPts(neck[0], neck[1] + 6, P.af, [RIG.upper, RIG.fore], fac), armB = limbPts(neck[0], neck[1] + 6, P.ab, [RIG.upper, RIG.fore], fac);
  const foot = leg => { const k = leg.at(-1); return [k, [k[0] + RIG.foot * fac, k[1]]]; };
  const hd = RIG.neck + RIG.head, head = [neck[0] + Math.sin(L) * hd * fac, neck[1] - Math.cos(L) * hd];
  g.save(); g.translate(F.x, F.y); g.scale(s, s); g.globalAlpha *= F.alpha ?? 1;
  g.lineCap = g.lineJoin = 'round'; g.lineWidth = RIG.w;
  // build-on order: torso -> legs -> arms -> head
  const seg = (pts, p) => strokeOn(g, pts, p, col, RIG.w);
  const backCol = F.backColor || col;
  strokeOn(g, legB, prog(d, .15, .45), backCol, RIG.w); strokeOn(g, foot(legB), prog(d, .4, .5), backCol, RIG.w);
  strokeOn(g, armB, prog(d, .35, .65), backCol, RIG.w);
  seg([[0, hipY], neck], prog(d, 0, .25));
  seg(legF, prog(d, .15, .45)); seg(foot(legF), prog(d, .4, .5));
  seg(armF, prog(d, .35, .65));
  const hp = E.back(prog(d, .55, .9));
  if (hp > 0) {
    g.save(); g.translate(head[0], head[1]); g.rotate(rad((P.head || 0) + (P.lean || 0) * .5) * fac); g.scale(hp, hp);
    g.beginPath(); g.arc(0, 0, RIG.head, 0, Math.PI * 2); g.fillStyle = col; g.fill();

function drawFace(g, expr, fac, c, p) {
  if (p <= 0) return; g.save(); g.globalAlpha *= p; g.fillStyle = c; g.strokeStyle = c; g.lineWidth = 4.5; g.lineCap = 'round';
  const ex = fac * 8, eyes = [[ex - 9, -6], [ex + 11, -6]];

  else eyes.forEach(([x, y]) => { g.beginPath(); g.arc(x, y, expr === 'surprised' ? 5.5 : 4.2, 0, Math.PI * 2); g.fill(); });
  const mx = ex + 1, my = 13; g.beginPath();
  switch (expr) {
    case 'happy': g.arc(mx, my - 6, 10, Math.PI * .15, Math.PI * .85); break;
    case 'sad': g.arc(mx, my + 8, 9, Math.PI * 1.2, Math.PI * 1.8); break;

    case 'angry': g.moveTo(mx - 8, my + 2); g.lineTo(mx + 8, my + 2); g.stroke(); g.beginPath(); g.moveTo(ex - 15, -18); g.lineTo(ex - 4, -13); g.moveTo(ex + 17, -18); g.lineTo(ex + 6, -13); break;

/** Thought bubble growing from a head point, with content painter (e.g. a red "?"). */
function thoughtBubble(g, hx, hy, bx, by, r, p, paint) {
  if (p <= 0) return;
  [[.25, 7], [.5, 12]].forEach(([f, rr], i) => { const q = E.back(prog(p, i * .12, i * .12 + .3)); if (q > 0) { g.beginPath(); g.arc(lerp(hx, bx, f), lerp(hy, by, f) , rr * q, 0, 7); g.fillStyle = PAL.ink; g.fill(); } });
  const q = E.back(prog(p, .25, .7)); if (q <= 0) return;
  g.save(); g.translate(bx, by); g.scale(q, q); g.beginPath(); g.arc(0, 0, r, 0, 7); g.fillStyle = PAL.cream; g.fill();
  g.lineWidth = 8; g.strokeStyle = PAL.ink; g.stroke(); if (paint) paint(g, r, prog(p, .55, 1)); g.restore();
}

/* ================= Typography ================= */
/** Headline: words rise through a mask, staggered. opts: size, align, red: [word indices], color, maxW, lh */
function headline(g, text, x, y, p, opts = {}) {
  if (p <= 0) return; const size = opts.size || 84, words = text.split(' '), red = opts.red || [];
  g.save(); g.font = font('head', size); g.textBaseline = 'alphabetic';
  const sp = g.measureText(' ').width, lines = [[]], maxW = opts.maxW || 1e9; let lw = 0;
  words.forEach((w, i) => { const ww = g.measureText(w).width; if (lw + ww > maxW && lines.at(-1).length) { lines.push([]); lw = 0; } lines.at(-1).push({ w, i, ww }); lw += ww + sp; });
  const lh = size * (opts.lh || 1.08), n = words.length, boxes = [];
  lines.forEach((ln, li) => {
    const tw = ln.reduce((a, o) => a + o.ww, 0) + sp * (ln.length - 1);
    let cx = opts.align === 'center' ? x - tw / 2 : opts.align === 'right' ? x - tw : x; const by = y + li * lh;
    ln.forEach(o => {
      const q = E.outQuint(prog(p, o.i / (n + 2), o.i / (n + 2) + .45));
      if (q > 0) { g.save(); g.beginPath(); g.rect(cx - 4, by - size * 1.05, o.ww + 8, size * 1.3); g.clip();
        g.fillStyle = red.includes(o.i) ? PAL.red : (opts.color || PAL.ink); g.fillText(o.w, cx, by + (1 - q) * size * 1.1); g.restore(); }
      boxes.push({ i: o.i, x: cx, y: by, w: o.ww, h: size });
      cx += o.ww + sp;
    });
  });
  g.restore();
  return boxes; // word boxes in the same space: use for underlines / arrows / circles on a word
}
/** Red underline swipe under a span (x, y, w). */

/* ================= Scene helpers (generic, proven in production) ================= */

/** Labelled block rising out of the ground (steps, layers, platforms, columns).

/* ================= Camera & world ================= */
function applyCamera(g, c, depth = 1) { const W = CONFIG.width, H = CONFIG.height, z = 1 + (c.z - 1) * depth; g.translate(W / 2, H / 2); g.rotate((c.r || 0) * depth); g.scale(z, z); g.translate(-c.x * depth - W / 2, -c.y * depth - H / 2); }

/* ================= Scene transitions (built from shapes, applied as enter masks) =================

/* ======================================================================================
   DEMO SCENES — REPLACE ENTIRELY with scenes built from the user's script (see beat map).
   Placeholder wording only. Times are in seconds; scenes may overlap for masked transitions.
   ====================================================================================== */
let SCENES = [], CUES = [], SFX_CUES = [], STORYBOARD = [];
function buildScenes() {
  const W = CONFIG.width, H = CONFIG.height, GY = 820;
  // Precompute morphs ONCE (never per frame).
  const blob = circlePoly(1240, 470, 150);
  const box = rrectPoly(860, 220, 760, 280, 28);
  const thirds = [0, 1, 2].map(i => rrectPoly(860 + i * 260, 220, 240, 280, 22));
  const mBlobBox = makeMorph(blob, box), mSplit = thirds.map(t => makeMorph(box, t));

  SCENES = [
    { id: 'A', start: 0, end: 7.2,
      camera: (t) => tween([[0, { x: 0, y: 30, z: 1.08 }], [6.5, { x: 0, y: 0, z: 1 }]], t),
      draw(g, t, T, c) {
        dotGrid(g, c);
        world(g, c, () => {
          groundLine(g, GY, prog(t, 0, .8));
          const walk = prog(t, .4, 3.2), x = lerp(-150, 620, E.inOut(walk));
          const pose = t < 3.2 ? walkPose(walk * 14, 1 - prog(t, 2.8, 3.2)) : poseMix(POSES.stand, POSES.think, E.inOut(prog(t, 3.3, 3.9)));
          const r = drawStickman(g, { x, y: GY, s: 1.25, pose, expr: t > 3.6 ? 'confused' : 'neutral' });
          thoughtBubble(g, r.head[0] + 40, r.head[1] - 40, r.head[0] + 170, r.head[1] - 170, 72, prog(t, 4.0, 5.2), (g2, rr, q) => {
            g2.globalAlpha *= q; g2.font = font('head', 96); g2.fillStyle = PAL.red; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.fillText('?', 0, 6);
          });
        });
        const wb = headline(g, 'HEADLINE WORDS FROM THE SCRIPT', 1180, 300, prog(t, 1.2, 2.6), { size: 76, red: [3], maxW: 640 });
        const key = wb && wb.find(b => b.i === 3); if (key) underline(g, key.x, key.y + 16, key.w, prog(t, 2.4, 2.9));
      } },
    { id: 'B', start: 6.6, end: CONFIG.duration, enter: { type: 'iris', x: 790, y: 470, dur: .9 },
      camera: (t) => tween([[0, { x: 60, y: 0, z: 1.12 }], [2.2, { x: 0, y: 0, z: 1 }], [5, { x: 0, y: 0, z: 1 }], [7.4, { x: 120, y: 20, z: 1.06 }]], t),
      draw(g, t, T, c) {
        dotGrid(g, c);
        world(g, c, () => {
          groundLine(g, GY, 1);
          // circle -> box -> three parts (one shape grows into the diagram)
          const pm = E.inOut(prog(t, .6, 1.6)), ps = E.inOut(prog(t, 2.0, 3.0));
          if (ps <= 0) fillPoly(g, mBlobBox(pm), PAL.ink);
          else mSplit.forEach((m, i) => fillPoly(g, m(ps), i === 2 ? (ps > .6 ? PAL.red : PAL.ink) : (ps > .6 ? rgba(PAL.gray, 1) : PAL.ink)));
          ['LABEL A', 'LABEL B', 'LABEL C'].forEach((txt, i) => leaderLabel(g, txt, 980 + i * 260, 220, 980 + i * 260, 160, prog(t, 3.2 + i * .35, 4.2 + i * .35), { color: i === 2 ? PAL.red : PAL.ink, size: 34 }));
          // figures pop onto each part
          [0, 1, 2].forEach(i => drawStickman(g, { x: 980 + i * 260, y: GY, s: .8, draw: prog(t, 4.4 + i * .3, 5.4 + i * .3),
            pose: i === 2 ? poseMix(POSES.stand, POSES.cheer, E.inOut(prog(t, 6.2, 6.8))) : (i === 1 ? POSES.shrug : POSES.cross),
            color: i === 2 ? PAL.red : PAL.ink, expr: i === 2 ? 'happy' : (i === 1 ? 'confused' : 'neutral') }));

  ];

  // SFX cues (only used when CONFIG.sfx): {t, type: whoosh|pop|click|draw|thud|chime}
  SFX_CUES = [{ t: .4, type: 'draw' }, { t: 4.1, type: 'pop' }, { t: 6.6, type: 'whoosh' }, { t: 7.3, type: 'whoosh' }, { t: 8.7, type: 'click' }, { t: 11.0, type: 'pop' }, { t: 13.1, type: 'chime' }];
  // Subtitle cues (only when CONFIG.subtitles). Text = script/voice wording, never invented.
  CUES = [{ start: 0.5, end: 6.4, text: 'Caption text from the script' }, { start: 6.8, end: 13.5, text: 'Next caption from the script' }];
}

/* ================= renderAt — deterministic, stateless ================= */
let canvas, ctx, showSubs = true;
function renderAt(seconds, g = ctx) {
  const t = clamp(seconds, 0, CONFIG.duration), W = CONFIG.width, H = CONFIG.height;
  g.save(); g.setTransform(g.canvas.width / W, 0, 0, g.canvas.height / H, 0, 0);
  g.fillStyle = PAL.cream; g.fillRect(0, 0, W, H);
  for (const s of SCENES) {
    if (t < s.start || t >= s.end + 1e-6) continue;
    const lt = t - s.start, T = s.end - s.start, c = Object.assign({ x: 0, y: 0, z: 1, r: 0 }, s.camera ? s.camera(lt, T) : {});
    g.save(); enterMask(g, s, lt); s.draw(g, lt, T, c); g.restore();
    enterEdge(g, s, lt);
  }
  if (CONFIG.subtitles && showSubs) drawSubs(g, t);
  g.restore();
}
function drawSubs(g, t) {
  const cue = CUES.find(q => t >= q.start && t < q.end); if (!cue) return;
  g.save(); g.font = font('body', 40); const w = g.measureText(cue.text).width + 48, x = CONFIG.width / 2, y = CONFIG.height - 70;
  fillPoly(g, rrectPoly(x - w / 2, y - 36, w, 64, 12, 4), rgba(PAL.ink, .82)); g.fillStyle = PAL.cream; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(cue.text, x, y - 3); g.restore();
}

/* ================= Audio: everything rendered offline from code (deterministic) ================= */
let voiceBuf = null, mixBuf = null;
const MUSIC = { bpm: 96, // chord roots as MIDI; minor-ish, calm-curious; tweak per script tone
  prog: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], accents: [] };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
async function renderMix() {
  if (!CONFIG.music && !CONFIG.sfx && !voiceBuf) return null;
  const sr = 44100, D = CONFIG.duration, oc = new OfflineAudioContext(2, Math.ceil(sr * D), sr);
  const comp = oc.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(oc.destination);
  const out = oc.createGain(); out.gain.value = .9; out.connect(comp);
  const rnd = rngFor('noise'), noise = oc.createBuffer(1, sr, sr), nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = rnd() * 2 - 1;
  const env = (node, t, a, peak, dcy, sus = 0.0001) => { node.gain.setValueAtTime(0.0001, t); node.gain.exponentialRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(sus, t + a + dcy); };
  if (voiceBuf) { const v = oc.createBufferSource(); v.buffer = voiceBuf; v.connect(out); v.start(0); }
  if (CONFIG.music) {
    const bus = oc.createGain(), lvl = voiceBuf ? .28 : .7; bus.connect(out);
    bus.gain.setValueAtTime(0.0001, 0); bus.gain.exponentialRampToValueAtTime(lvl, 1.6);
    bus.gain.setValueAtTime(lvl, Math.max(1.7, D - 2.6)); bus.gain.exponentialRampToValueAtTime(0.0001, D - .05);
    const beat = 60 / MUSIC.bpm, bar = beat * 4, bars = Math.ceil(D / bar);
    const pluck = (t, f, dur, gain = .12, type = 'triangle', cut = 2600) => { if (t > D - .1) return; const o = oc.createOscillator(), gN = oc.createGain(), lp = oc.createBiquadFilter(); o.type = type; o.frequency.value = f; lp.frequency.value = cut; o.connect(lp).connect(gN).connect(bus); env(gN, t, .006, gain, dur); o.start(t); o.stop(t + dur + .05); };
    const kick = t => { const o = oc.createOscillator(), gN = oc.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .14); o.connect(gN).connect(bus); env(gN, t, .004, .55, .32); o.start(t); o.stop(t + .4); };
    const hat = (t, a = .05) => { const s = oc.createBufferSource(), hp = oc.createBiquadFilter(), gN = oc.createGain(); s.buffer = noise; hp.type = 'highpass'; hp.frequency.value = 7500; s.connect(hp).connect(gN).connect(bus); env(gN, t, .002, a, .05); s.start(t, rnd() * .5, .08); };
    for (let b = 0; b < bars; b++) {
      const t0 = b * bar, last = b >= bars - 1, ch = MUSIC.prog[b % MUSIC.prog.length], intro = b < 2;
      if (last) { ch.forEach(m => pluck(t0, mtof(m), bar * .9, .08, 'sine', 1800)); pluck(t0, mtof(MUSIC.prog[0][0] - 24), bar, .2, 'sine', 400); continue; }
      const arp = [0, 1, 2, 1, 0, 1, 2, 1].map((k, i) => ch[k] + (i % 4 === 2 ? 12 : 0));
      arp.forEach((m, i) => pluck(t0 + i * beat / 2, mtof(m + 12), beat * .9, intro ? .06 : .09));
      pluck(t0, mtof(ch[0] - 24), beat * 1.8, .2, 'sine', 500); pluck(t0 + beat * 2, mtof(ch[0] - 24), beat * 1.6, .17, 'sine', 500);
      if (!intro) { kick(t0); kick(t0 + beat * 2); for (let i = 0; i < 4; i++) hat(t0 + i * beat + beat / 2); }
      if (b % 4 === 3 && !intro) pluck(t0 + beat * 3.5, mtof(ch[2] + 24), beat, .05, 'sine'); // phrase-end sparkle
    }
    MUSIC.accents.forEach(t => pluck(t, mtof(MUSIC.prog[0][2] + 24), 1.2, .07, 'sine'));
  }
  if (CONFIG.sfx) {
    const sfxBus = oc.createGain(); sfxBus.gain.value = voiceBuf ? .35 : .6; sfxBus.connect(out);
    const nz = (t, dur, f0, f1, q, peak, type = 'bandpass') => { const s = oc.createBufferSource(), bp = oc.createBiquadFilter(), gN = oc.createGain(); s.buffer = noise; bp.type = type; bp.Q.value = q; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur); s.connect(bp).connect(gN).connect(sfxBus); gN.gain.setValueAtTime(0.0001, t); gN.gain.exponentialRampToValueAtTime(peak, t + dur * .4); gN.gain.exponentialRampToValueAtTime(0.0001, t + dur); s.start(t, 0, dur + .05); };
    const tone = (t, f0, f1, dur, peak, type = 'sine') => { const o = oc.createOscillator(), gN = oc.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); o.connect(gN).connect(sfxBus); env(gN, t, .005, peak, dur); o.start(t); o.stop(t + dur + .05); };
    SFX_CUES.forEach(({ t, type }) => {
      if (t > D - .05) return;
      if (type === 'whoosh') nz(t, .45, 400, 2400, 1.2, .5);
      else if (type === 'pop') tone(t, 520, 900, .09, .35);
      else if (type === 'click') tone(t, 1800, 1200, .03, .25, 'square');
      else if (type === 'draw') nz(t, .6, 3000, 3600, 6, .12);
      else if (type === 'thud') tone(t, 140, 60, .2, .5);
      else if (type === 'chime') { tone(t, 880, 880, .9, .18); tone(t + .08, 1320, 1320, .8, .12); }
    });
  }
  return oc.startRendering();
}

/* ================= Player ================= */
const $ = id => document.getElementById(id);
let playing = false, tNow = 0, wallStart = 0, ac = null, src = null, acStart = 0, audioOn = true;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function sizePreview() {
  const cw = $('stage').clientWidth || 960, w = Math.max(320, Math.min(CONFIG.width, Math.round(cw * Math.min(2, devicePixelRatio || 1))));
  canvas.width = w; canvas.height = Math.round(w * CONFIG.height / CONFIG.width); renderAt(tNow);
}
function setTime(t) { tNow = clamp(t, 0, CONFIG.duration); renderAt(tNow); $('seek').value = Math.round(tNow / CONFIG.duration * 1000); $('time').textContent = `${fmt(tNow)} / ${fmt(CONFIG.duration)}`; }
function clockNow() { return (src && ac) ? tNow0 + (ac.currentTime - acStart) : tNow0 + (performance.now() - wallStart) / 1000; }
let tNow0 = 0;
function startAudio() {
  if (!mixBuf || !audioOn) return;
  ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume();
  src = ac.createBufferSource(); src.buffer = mixBuf; src.connect(ac.destination); acStart = ac.currentTime + .03; src.start(acStart, tNow0);
}
function stopAudio() { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; } }
function loop() {
  if (!playing) return; const t = clockNow();
  if (t >= CONFIG.duration) { pause(); setTime(CONFIG.duration); return; }
  setTime(t); requestAnimationFrame(loop);
}
function play() { if (tNow >= CONFIG.duration) tNow = 0; tNow0 = tNow; wallStart = performance.now(); startAudio(); playing = true; $('play').textContent = 'Pause'; requestAnimationFrame(loop); }
function pause() { playing = false; stopAudio(); $('play').textContent = 'Play'; }

/* ================= Storyboard contact sheet (same renderAt) ================= */
function buildStoryboard() {
  $('sb').style.display = 'block'; const grid = $('sbGrid'); grid.innerHTML = '';
  STORYBOARD.forEach((f, i) => {
    const cell = document.createElement('div'), c = document.createElement('canvas'), cap = document.createElement('div');
    cell.className = 'sbCell' + (i === 0 ? ' sel' : ''); c.width = 640; c.height = Math.round(640 * CONFIG.height / CONFIG.width);
    renderAt(f.t, c.getContext('2d')); cap.textContent = `${i + 1}. ${f.title} · ${fmt(f.t)}`; cell.append(c, cap); grid.append(cell);
    cell.onclick = () => { document.querySelectorAll('.sbCell').forEach(e => e.classList.remove('sel')); cell.classList.add('sel'); setTime(f.t); };
  });
  if (STORYBOARD[0]) setTime(STORYBOARD[0].t);
}

/* ================= Export: real MP4 only ================= */
const status = m => { $('status').textContent = m; };
// Downloads: inside a published claude.ai Artifact a plain <a download> is inert, so the page declares the
// `downloads` capability (publish with capabilities: {downloads: true}) and saves through it on the viewer's click.
// Opened as a local file, the same link falls back to a normal browser download.
let lastBlob = null, lastExt = 'mp4', dlNS = null;
function offer(blob, ext) { lastBlob = blob; lastExt = ext; const a = $('dl'); a.href = URL.createObjectURL(blob); a.download = `${CONFIG.fileName}.${ext}`; a.hidden = false; a.textContent = `Download Video (.${ext}, ${(blob.size / 1e6).toFixed(1)} MB)`; }
async function saveVideo(e) {
  if (!dlNS || !lastBlob) return; // local file: let the browser download the blob link
  e.preventDefault();
  try { await dlNS.save({ filename: `${CONFIG.fileName}.${lastExt}`, data: lastBlob }); status(`Saved ${CONFIG.fileName}.${lastExt}.`); }
  catch (err) { status(err && err.code === 'declined' ? 'Save cancelled.' : `Could not save here (${err && err.code}). Open the HTML file in desktop Chrome/Edge to export.`); }
}
async function isMp4(blob) { const b = new Uint8Array(await blob.slice(0, 12).arrayBuffer()); return String.fromCharCode(b[4], b[5], b[6], b[7]) === 'ftyp'; }
function exportCanvas() { const c = document.createElement('canvas'); c.width = CONFIG.width; c.height = CONFIG.height; return c; }
const MEDIABUNNY_URL = 'https://cdn.jsdelivr.net/npm/mediabunny@1.0.0/+esm';
// Route A: WebCodecs + Mediabunny — frame-exact renderAt(i/fps), H.264 + AAC.
async function exportWebCodecs(audioBuffer) {
  if (!window.VideoEncoder) return null;
  let MB; try { MB = await import(MEDIABUNNY_URL); } catch (e) { console.warn('Mediabunny load failed', e); return null; }
  const c = exportCanvas(), g = c.getContext('2d');
  const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new MB.BufferTarget() });
  const video = new MB.CanvasSource(c, { codec: 'avc', bitrate: MB.QUALITY_HIGH }); output.addVideoTrack(video, { frameRate: CONFIG.fps });
  let audio = null;
  if (audioBuffer) { if (MB.canEncodeAudio && !(await MB.canEncodeAudio('aac'))) return null; audio = new MB.AudioBufferSource({ codec: 'aac', bitrate: MB.QUALITY_HIGH }); output.addAudioTrack(audio); }
  await output.start();
  if (audio) await audio.add(audioBuffer);
  const n = Math.round(CONFIG.duration * CONFIG.fps);
  for (let i = 0; i < n; i++) { renderAt(i / CONFIG.fps, g); await video.add(i / CONFIG.fps, 1 / CONFIG.fps); if (i % 15 === 0) status(`Encoding MP4 frame ${i} / ${n}`); }
  await output.finalize();
  const blob = new Blob([output.target.buffer], { type: 'video/mp4' }); return (await isMp4(blob)) ? blob : null;
}
// Route B: native MediaRecorder MP4 (real time), audio mixed through a MediaStream destination.
async function exportNative(audioBuffer) {
  const types = ['video/mp4;codecs=avc1.42E01F,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4'];
  const mime = window.MediaRecorder && types.find(m => MediaRecorder.isTypeSupported(m)); if (!mime) return null;
  const c = exportCanvas(), g = c.getContext('2d'), stream = c.captureStream(CONFIG.fps);
  let xac = null, xsrc = null;
  if (audioBuffer) { xac = new AudioContext(); const dest = xac.createMediaStreamDestination(); xsrc = xac.createBufferSource(); xsrc.buffer = audioBuffer; xsrc.connect(dest); dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr)); }
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 }), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data); const done = new Promise(r => rec.onstop = r);
  renderAt(0, g); rec.start(250); const t0w = performance.now(), t0a = xac ? xac.currentTime + .05 : 0; if (xsrc) xsrc.start(t0a);
  await new Promise(res => { (function f() { const t = xac ? xac.currentTime - t0a : (performance.now() - t0w) / 1000; renderAt(clamp(t, 0, CONFIG.duration), g); status(`Recording MP4 (real time) ${fmt(Math.max(0, t))} / ${fmt(CONFIG.duration)}`); t < CONFIG.duration ? requestAnimationFrame(f) : res(); })(); });
  rec.stop(); await done; if (xac) xac.close();
  const blob = new Blob(chunks, { type: 'video/mp4' }); return (await isMp4(blob)) ? blob : null;
}
async function exportWebM() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported('video/webm')) return null;
  const c = exportCanvas(), g = c.getContext('2d'), rec = new MediaRecorder(c.captureStream(CONFIG.fps), { mimeType: 'video/webm', videoBitsPerSecond: 12e6 }), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data); const done = new Promise(r => rec.onstop = r);
  rec.start(250); const start = performance.now();
  await new Promise(res => { (function f() { const t = (performance.now() - start) / 1000; renderAt(Math.min(t, CONFIG.duration), g); status(`Recording WebM ${fmt(t)}`); t < CONFIG.duration ? requestAnimationFrame(f) : res(); })(); });
  rec.stop(); await done; return new Blob(chunks, { type: 'video/webm' });
}
async function exportVideo() {
  pause(); $('export').disabled = true; $('dl').hidden = true;
  try {
    const aud = audioOn ? mixBuf : (voiceBuf ? mixBuf : null);
    let blob = await exportWebCodecs(aud) || await exportNative(aud);
    if (blob) { offer(blob, 'mp4'); status(`MP4 ready (${CONFIG.width}×${CONFIG.height}, ${CONFIG.fps} fps, ${aud ? 'with' : 'no'} audio).`); return; }
    status('This environment cannot encode MP4. Open this HTML file in desktop Chrome/Edge to export MP4. Trying a WebM fallback…');
    blob = await exportWebM();
    if (blob) { offer(blob, 'webm'); status('MP4 unavailable here — WebM fallback ready (not an MP4, no audio).'); }
    else status('Video export is blocked in this environment. Open this HTML file in desktop Chrome/Edge.');
  } catch (e) { console.error(e); status('Export failed: ' + e.message); }
  finally { $('export').disabled = false; setTime(tNow); }
}
function srt() {
  const ts = s => { const ms = Math.round(s * 1000), h = Math.floor(ms / 3.6e6), m = Math.floor(ms / 6e4) % 60, se = Math.floor(ms / 1000) % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(se).padStart(2, '0')},${String(ms % 1000).padStart(3, '0')}`; };
  const txt = CUES.map((c, i) => `${i + 1}\n${ts(c.start)} --> ${ts(c.end)}\n${c.text}\n`).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' })); a.download = `${CONFIG.fileName}.srt`; a.click();
}

/* ================= Boot ================= */
async function rebuildAudio() { if (CONFIG.music || CONFIG.sfx || voiceBuf) { status('Rendering audio…'); mixBuf = await renderMix(); status(''); } }
(async function boot() {
  canvas = $('view'); ctx = canvas.getContext('2d');
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  buildScenes();
  $('play').onclick = () => playing ? pause() : play();
  $('restart').onclick = () => { pause(); setTime(0); play(); };
  $('seek').oninput = e => { const was = playing; pause(); setTime(e.target.value / 1000 * CONFIG.duration); if (was) play(); };
  $('export').onclick = exportVideo; $('dl').onclick = saveVideo;
  if (window.claude && window.claude.use) window.claude.use('downloads').then(ns => { dlNS = ns; }).catch(() => {});
  if (CONFIG.music || CONFIG.sfx) { $('audioBtn').hidden = false; $('audioBtn').textContent = `${CONFIG.music ? 'Music' : 'Sound'}: On`; $('audioBtn').onclick = () => { audioOn = !audioOn; $('audioBtn').textContent = `${CONFIG.music ? 'Music' : 'Sound'}: ${audioOn ? 'On' : 'Off'}`; if (playing) { pause(); play(); } }; }
  if (CONFIG.voiceover) { $('voWrap').hidden = false; $('voFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; pause(); const tmp = new AudioContext(); voiceBuf = await tmp.decodeAudioData(await f.arrayBuffer()); tmp.close(); CONFIG.duration = voiceBuf.duration; buildScenes(); await rebuildAudio(); setTime(0); status(`Voiceover loaded: ${voiceBuf.duration.toFixed(2)} s (master clock).`); }; }
  if (CONFIG.subtitles) { $('subBtn').hidden = $('srtBtn').hidden = false; $('subBtn').onclick = () => { showSubs = !showSubs; $('subBtn').textContent = `Subtitles: ${showSubs ? 'On' : 'Off'}`; setTime(tNow); }; $('srtBtn').onclick = srt; }
  addEventListener('resize', sizePreview); sizePreview(); setTime(0);
  if (CONFIG.mode === 'storyboard') { buildStoryboard(); $('export').hidden = true; $('audioBtn').hidden = true; }
  else await rebuildAudio();
  window.renderAt = renderAt; window.CONFIG = CONFIG; window.SCENES = SCENES;
})();
</script>
</body>
</html>
